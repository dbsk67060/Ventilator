version: "3.8"

services:
  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - /DATA/AppData/mosquitto/config:/mosquitto/config
      - /DATA/AppData/mosquitto/data:/mosquitto/data
      - /DATA/AppData/mosquitto/log:/mosquitto/log
    environment:
      - TZ=Europe/Copenhagen
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -t healthcheck/test -m 'ping' -q 0 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  questdb:
    image: questdb/questdb:latest
    container_name: questdb
    restart: unless-stopped
    environment:
      - TZ=Europe/Copenhagen
    ports:
      - "9001:9000"
      - "8812:8812"
    volumes:
      - /DATA/AppData/questdb:/var/lib/questdb
    healthcheck:
      # Simple TCP check on the HTTP port (QuestDB web console)
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9000 || exit 1'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
     
  fastapi:
    image: tiangolo/uvicorn-gunicorn-fastapi:python3.11
    container_name: fastapi
    restart: unless-stopped
    working_dir: /app
    volumes:
      - /DATA/AppData/api:/app
    ports:
      - "18081:80"
    environment:
      - TZ=Europe/Copenhagen
      - QDB_HOST=questdb
      - QDB_PORT=8812
      - MQTT_HOST=mqtt
      - MQTT_PORT=1883
      - CORS_ORIGIN=http://localhost:3000
      - MQTT_SUB_TOPICS=test/#,spBv1.0/#
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             uvicorn main:app --host 0.0.0.0 --port 80"
    healthcheck:
      # Requires a /health endpoint in your FastAPI app
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1/health', timeout=3)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  flask:
    image: python:3.11-slim
    container_name: flask
    restart: unless-stopped
    working_dir: /app
    volumes:
      - /DATA/AppData/flask:/app
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: >
      sh -c "pip install --no-cache-dir flask docker && 
             python app.py"
    ports:
      - "15000:5000"
    environment:
      - TZ=Europe/Copenhagen
      - QDB_HOST=questdb
      - QDB_PORT=8812
      - MQTT_HOST=mqtt
      - MQTT_PORT=1883
    healthcheck:
      # Requires a /health endpoint in your Flask app
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
   
  spb_emulator:
    image: python:3.11-slim
    container_name: spb_emulator
    working_dir: /app
    volumes:
      - /DATA/AppData/spb_emulator:/app
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             python pub.py"
    environment:
      - TZ=Europe/Copenhagen
      - MQTT_HOST=mqtt
      - MQTT_PORT=1883
      - SPB_GROUP=plantA
      - SPB_EON=test-eon
      - SPB_DEVICE=test-device
      - SPB_HEALTH_PORT=8001          # <--- matches pub.py health server
    depends_on:
      - mqtt
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)\" || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s

  spb_ingestor:
    image: python:3.11-slim
    container_name: spb_ingestor
    working_dir: /app
    volumes:
      - /DATA/AppData/spb_ingestor:/app
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             python main.py"
    environment:
      - TZ=Europe/Copenhagen
      - MQTT_HOST=mqtt
      - MQTT_PORT=1883
      - SPB_GROUP=plantA
      - QDB_ILP_HOST=questdb
      - QDB_ILP_PORT=8812      # ILP port inside questdb container
      - QDB_TABLE=sensor_data
      - INGESTOR_HEALTH_PORT=8002   # <--- matches main.py health server
    depends_on:
      - mqtt
      - questdb
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3)\" || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s

  pyscripts:         
    image: python:3.11-slim
    container_name: pyscripts
    restart: unless-stopped
    working_dir: /scripts
    volumes:
      - /DATA/AppData/pyscripts:/scripts
    command: tail -f /dev/null
    environment:
      - TZ=Europe/Copenhagen
  # No healthcheck here – this is just a utility container with no service

  # -----------------------------
  # LOGGING + MONITORING STACK
  # -----------------------------

  loki:
    image: grafana/loki:2.9.7
    container_name: loki
    restart: unless-stopped
    user: "10001"
    ports:
      - "3100:3100"
    volumes:
      - /DATA/AppData/loki/config.yaml:/etc/loki/local-config.yaml:ro
      - /DATA/AppData/loki/chunks:/loki/chunks
      - /DATA/AppData/loki/rules:/loki/rules

    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


  promtail:
    image: grafana/promtail:2.9.4
    container_name: promtail
    restart: unless-stopped
    user: "10001:986"
    volumes:

     - /var/lib/docker/containers:/var/lib/docker/containers:ro
     - /DATA/AppData/promtail/config.yml:/etc/promtail/config.yaml:ro
     - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
     loki:
      condition: service_healthy


    # No healthcheck here – promtail’s readiness depends heavily on config & logs present,
    # and Docker-level healthchecks tend to flap for it.

  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - TZ=Europe/Copenhagen
    volumes:
      - /DATA/AppData/grafana:/var/lib/grafana
    depends_on:
      - loki
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
